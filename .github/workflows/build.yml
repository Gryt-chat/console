name: Build console image

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build console image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The lockout ledger decides who may try the password, so it is checked
      # before anything else. It takes `now` as a parameter, so the tests assert
      # on a lockout expiring without waiting fifteen minutes for it.
      - run: npm test

      # tsc next, so a type error fails here rather than inside the image build.
      - run: npm run build

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main is pushed. A pull request builds to prove it compiles and
      # stops there, so a branch can never become what the VPS pulls.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/gryt-chat/console:latest
            ghcr.io/gryt-chat/console:${{ github.sha }}
